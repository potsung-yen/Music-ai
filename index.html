<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Piano Transcriber Pro - Peter Yen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.css" />
  <style>
    :root { --primary: #1DB954; --bg: #f8f9fa; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; align-items: center; }
    #container { width: 90%; max-width: 600px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-top: 50px; }
    .header { text-align: center; margin-bottom: 30px; }
    .status-box { background: #e9ecef; border-radius: 8px; padding: 15px; font-size: 14px; color: #495057; min-height: 50px; margin: 20px 0; border-left: 5px solid var(--primary); }
    #upload-btn { display: block; width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
    #upload-btn:disabled { background: #ccc; }
    .progress-container { width: 100%; background: #eee; height: 8px; border-radius: 4px; display: none; margin-top: 10px; }
    .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
  </style>
</head>
<body>

  <div id="container">
    <div class="header">
      <h2>🎹 AI 鋼琴全曲轉譜</h2>
      <p style="color: #666; font-size: 14px;">免伺服器，本機 AI 運算 (支援長曲)</p>
    </div>

    <div id="status" class="status-box">正在下載 AI 環境 (約 60MB)...</div>

    <div class="progress-container" id="p-container">
      <div id="p-bar" class="progress-bar"></div>
    </div>

    <input type="file" id="audio-input" accept="audio/*" style="display: none;">
    <button id="upload-btn" disabled>等待環境就緒...</button>
    
    <div id="result-area" style="margin-top: 20px; text-align: center; display: none;">
      <p style="color: green; font-weight: bold;">✅ 轉換完成！</p>
      <a id="download-link" style="text-decoration: none; color: white; background: #333; padding: 10px 20px; border-radius: 5px;">📥 下載 MIDI 檔案</a>
    </div>
  </div>

  <div id="stlite-root" style="display: none;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const uploadBtn = document.getElementById('upload-btn');
    const audioInput = document.getElementById('audio-input');
    const pContainer = document.getElementById('p-container');
    const pBar = document.getElementById('p-bar');

    // 啟動隱形 Python 引擎
    const st = stlite.mount({
      requirements: ["basic-pitch", "librosa", "pretty_midi", "numpy"],
      entrypoint: "engine.py",
      files: {
        "engine.py": `
import io, librosa, gc, numpy as np, pretty_midi
from basic_pitch.inference import predict
from basic_pitch import ICASSP_2022_MODEL_PATH
import js

async def process_audio(audio_bytes):
    try:
        # 讀取與分割
        y, sr = librosa.load(io.BytesIO(audio_bytes.to_py()), sr=22050)
        duration = librosa.get_duration(y=y, sr=sr)
        chunk_size = 30
        num_chunks = int(np.ceil(duration / chunk_size))
        
        final_midi = pretty_midi.PrettyMIDI()
        piano = pretty_midi.Instrument(program=0)
        final_midi.instruments.append(piano)

        for i in range(num_chunks):
            start = i * chunk_size
            end = min((i + 1) * chunk_size, duration)
            js.updateStatus(f"正在辨識: {start}s - {end}s...")
            js.updateProgress(int(((i+1)/num_chunks)*100))
            
            y_chunk = y[int(start*sr):int(end*sr)]
            _, midi_chunk, _ = predict(ICASSP_2022_MODEL_PATH, y_chunk)
            
            for inst in midi_chunk.instruments:
                for n in inst.notes:
                    n.start += start
                    n.end += start
                    piano.notes.append(n)
            
            del y_chunk, midi_chunk
            gc.collect()

        # 輸出
        midi_io = io.BytesIO()
        final_midi.write(midi_io)
        return midi_io.getvalue()
    except Exception as e:
        return str(e)
`
      },
      onMount: () => {
        statusEl.innerText = "✅ 環境已就緒，請上傳音檔";
        uploadBtn.innerText = "選擇音檔並開始 AI 轉譜";
        uploadBtn.disabled = false;
      }
    });

    // 介面交互
    uploadBtn.onclick = () => audioInput.click();

    audioInput.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      uploadBtn.disabled = true;
      pContainer.style.display = 'block';
      statusEl.innerText = "正在讀取檔案並分析...";

      const arrayBuffer = await file.arrayBuffer();
      const uint8Array = new Uint8Array(arrayBuffer);

      // 呼叫 Python 引擎 (透過 stlite 內部路徑)
      try {
        const engine = await st.pyodide.runPythonAsync("process_audio");
        const midiResult = await engine(uint8Array);
        
        if (typeof midiResult === 'string') throw midiResult;

        // 處理下載
        const blob = new Blob([midiResult], { type: 'audio/midi' });
        const url = URL.createObjectURL(blob);
        const link = document.getElementById('download-link');
        link.href = url;
        link.download = "output.mid";
        document.getElementById('result-area').style.display = 'block';
        statusEl.innerText = "🎉 轉換成功！";
      } catch (err) {
        statusEl.innerText = "❌ 錯誤: " + err;
        uploadBtn.disabled = false;
      }
    };

    // 被 Python 呼叫的 JS 函數
    window.updateStatus = (msg) => { statusEl.innerText = msg; };
    window.updateProgress = (val) => { pBar.style.width = val + '%'; };
  </script>
</body>
</html>
