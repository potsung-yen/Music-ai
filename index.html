<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Piano Transcriber</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.css" />
</head>
<body>
  <!-- 最基礎的載入狀態文字 -->
  <div id="loading" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
    <h3 id="status">正在加載 AI 鋼琴辨識環境...</h3>
    <p style="color:#888; font-size:14px;">下載模型約 60MB，請勿關閉網頁</p>
  </div>

  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js"></script>
  <script>
    // 啟動 stlite
    stlite.mount({
      requirements: ["basic-pitch", "librosa", "pandas", "altair", "pretty_midi"],
      entrypoint: "app.py",
    }, document.getElementById("root"));

    // 每 5 秒自動更新一下狀態文字，讓你知道它沒當機
    const states = ["正在下載模型權重...", "正在初始化 Python...", "正在分配記憶體...", "即時解析環境準備中..."];
    let i = 0;
    setInterval(() => {
      const statusEl = document.getElementById("status");
      if (statusEl) statusEl.innerText = states[i % states.length];
      i++;
    }, 5000);
  </script>
</body>
</html>
