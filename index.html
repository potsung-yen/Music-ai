<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Piano Transcriber Pro</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f2f5; }
    #app-card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
    .btn { background: #1DB954; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
    .btn:disabled { background: #ccc; }
    #status { margin: 1rem 0; color: #555; font-size: 14px; }
    .progress-bg { background: #eee; height: 8px; border-radius: 4px; overflow: hidden; display: none; }
    #progress-fill { background: #1DB954; width: 0%; height: 100%; transition: width 0.3s; }
  </style>
</head>
<body>

  <div id="app-card">
    <h2>🎹 AI 鋼琴轉譜</h2>
    <div id="status">正在建立 AI 核心...</div>
    <div class="progress-bg" id="pg-box"><div id="progress-fill"></div></div>
    <br>
    <input type="file" id="audio-file" style="display:none" accept="audio/*">
    <button id="main-btn" class="btn" disabled>初始化中...</button>
    <div id="download-area" style="margin-top:20px; display:none">
        <a id="midi-link" href="#" style="color:#1DB954; font-weight:bold; text-decoration:none">📥 下載 MIDI 結果</a>
    </div>
  </div>

  <div id="stlite-container" style="display:none"></div>

  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.39.0/build/stlite.js"></script>
  <script>
    const btn = document.getElementById('main-btn');
    const status = document.getElementById('status');
    const pgBox = document.getElementById('pg-box');
    const pgFill = document.getElementById('progress-fill');

    // 啟動一個「空UI」的 stlite
    const mount = stlite.mount({
      requirements: ["basic-pitch", "librosa", "pretty_midi"],
      entrypoint: "main.py",
      files: {
        "main.py": `
import js, io, librosa, gc, numpy as np, pretty_midi
from basic_pitch.inference import predict
from basic_pitch import ICASSP_2022_MODEL_PATH

async def run_ai(data):
    y, sr = librosa.load(io.BytesIO(data.to_py()), sr=22050)
    duration = librosa.get_duration(y=y, sr=sr)
    chunk_size = 30
    num_chunks = int(np.ceil(duration / chunk_size))
    
    mid = pretty_midi.PrettyMIDI()
    piano = pretty_midi.Instrument(program=0)
    mid.instruments.append(piano)

    for i in range(num_chunks):
        s, e = i*chunk_size, min((i+1)*chunk_size, duration)
        js.updateUI(f"辨識中: {s}s-{e}s", int((i+1)/num_chunks*100))
        
        y_c = y[int(s*sr):int(e*sr)]
        _, mc, _ = predict(ICASSP_2022_MODEL_PATH, y_c)
        for inst in mc.instruments:
            for n in inst.notes:
                n.start += s
                n.end += s
                piano.notes.append(n)
        del y_c, mc
        gc.collect()

    out = io.BytesIO()
    mid.write(out)
    return out.getvalue()
`
      },
      onMount: () => {
        status.innerText = "✅ 環境已就緒";
        btn.innerText = "選擇音檔並轉譜";
        btn.disabled = false;
      }
    }, document.getElementById("stlite-container"));

    // JS 交互
    btn.onclick = () => document.getElementById('audio-file').click();

    document.getElementById('audio-file').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      btn.disabled = true;
      pgBox.style.display = 'block';
      status.innerText = "讀取音訊中...";

      const buf = await file.arrayBuffer();
      try {
        const func = await mount.pyodide.runPythonAsync("run_ai");
        const res = await func(new Uint8Array(buf));
        
        const url = URL.createObjectURL(new Blob([res], {type:'audio/midi'}));
        document.getElementById('midi-link').href = url;
        document.getElementById('download-area').style.display = 'block';
        status.innerText = "🎉 轉譜完成！";
      } catch (err) {
        status.innerText = "❌ 發生錯誤: " + err;
        btn.disabled = false;
      }
    };

    window.updateUI = (msg, val) => {
        status.innerText = msg;
        pgFill.style.width = val + "%";
    };
  </script>
</body>
</html>
